<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai01.html</title>

   <style>
         * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

        :root {
            --bg-frame: #FFFDE7;
            --border-frame: #9E9E9E;
            --bg-title: #FFD9E6;
            --color-red: #D40000;
            --color-blue: #0033CC;

        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            padding: 20px;
        }

        .khung-tho {
            width: 640px;
            max-width: 100%;
            background-color: var(--bg-frame);
            border: 1px solid var(--border-frame);
            padding: 24px;
            text-align: center;
        }
        h1 {
            color: var(--color-red);
            background-color: var(--bg-title);
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px;
        }
        p {
            font-style: italic;
            line-height: 1.7;
            font-size: 18px;
        }
        .kho-xanh {
            color: var(--color-blue);
        }
        .kho-do {
            color: var(--color-red);
        }
        hr {
            width: 55%;
            border: 0;
            height: 1px;
            background-color: var(--color-blue);
            margin: 16px auto;
        }
    </style>
</head>
<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>
        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen <br>
            Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ <br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
</body>
</html>
